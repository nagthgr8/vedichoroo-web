<div class="container mt-5">
  <h2 class="mb-4">Subscribe to Vedic Astro</h2>
  <form [formGroup]="subscribeForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="name" class="form-label">Full Name</label>
      <input type="text" id="name" formControlName="name" class="form-control" />
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <input type="email" id="email" formControlName="email" class="form-control" />
    </div>

    <div class="mb-3">
      <label for="mobile" class="form-label">Mobile Number</label>
      <input type="text" id="mobile" formControlName="mobile" class="form-control" />
    </div>

    <div class="mb-3">
      <label for="plan" class="form-label">Select Plan</label>
      <select formControlName="plan" class="form-select">
        <option value="">-- Choose Plan --</option>
     <option value="monthly">Monthly (₹100)</option>
    <option value="yearly">Yearly (₹999)</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="subscribeForm.invalid">Subscribe</button>
  </form>

<p class="mt-3 text-muted">
  After completing the payment, your subscription will be activated, and a unique subscription key will be sent to your registered email address.
  Please use this key when prompted by any of our Astrology Apps to unlock full access.
</p>

</div>
